name: Release VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert SVG icon to PNG
        run: |
          npm install --no-save sharp
          node - <<'NODE'
          const sharp = require('sharp');

          async function main() {
            await sharp('images/icon.svg')
              .resize(256, 256)
              .png()
              .toFile('images/icon.png');
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Package VSIX
        run: |
          mkdir -p releases
          VERSION=$(node -p "require('./package.json').version")
          npx vsce package --allow-missing-repository --out "releases/jemo-theme-${VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jemo-theme-vsix
          path: releases/*.vsix

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*.vsix
